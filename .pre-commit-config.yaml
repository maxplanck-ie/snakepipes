ci:
  autofix_commit_msg: |
    [pre-commit] fixes from hooks
  autofix_prs: true
  autoupdate_branch: "master"
  autoupdate_commit_msg: "pre-commit.ci autoupdate"
  autoupdate_schedule: monthly
  # Hooks below are new to this repo; skipping them in CI for now so this
  # doesn't trigger a repo-wide autofix/reformat. Lift the skips once a
  # dedicated formatting pass has been done.
  skip: [trailing-whitespace, end-of-file-fixer, codespell, ruff-check, ruff-format, zizmor, snakefmt]
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [python]
      - id: end-of-file-fixer
        types: [python]
      - id: check-merge-conflict

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--write-changes]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.27.0
    hooks:
      - id: zizmor

  - repo: https://github.com/snakemake/snakefmt
    rev: v0.11.0
    hooks:
      - id: snakefmt
